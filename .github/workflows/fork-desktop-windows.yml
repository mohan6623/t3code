name: Fork Desktop Windows

# Builds the fork's Windows installer on GitHub's free runners and publishes
# it as a prerelease. The installer keeps the official app id and nightly
# product name, so it installs over "T3 Code (Nightly)" and keeps the same
# user data. Its updater reads this fork's prereleases instead of upstream,
# so installed copies update to each build published here. The same release
# carries the Linux CLI archive that the app installs on SSH hosts.

on:
  push:
    branches:
      - custom/usage-badge
  workflow_dispatch:

permissions:
  contents: write

# A half-published release would leave the updater a manifest without its
# installer, so a newer push waits instead of cancelling.
concurrency:
  group: fork-desktop-windows
  cancel-in-progress: false

jobs:
  # Nightly-shaped versions keep the "(Nightly)" product name. The date and
  # a run number above upstream's build counter keep each fork build newer
  # than the official nightly it replaces. Resolved once so the installer and
  # the CLI archive it downloads over SSH carry the same version.
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base="$(node -p "const [a,b,c]=require('./apps/desktop/package.json').version.split('-')[0].split('.').map(Number); [a,b,c+1].join('.')")"
          version="${base}-nightly.$(date -u +%Y%m%d).$((9000 + GITHUB_RUN_NUMBER))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

  # The desktop app starts SSH environments by downloading
  # t3-<version>-linux-x64.tar.gz and SHA256SUMS from the release with its own
  # version (see packages/shared/src/cliRelease.ts). Upstream has no release
  # for a fork version, so the fork has to attach the archive itself.
  cli_linux:
    name: Build Linux x64 CLI archive
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"

      # t3#build depends on @t3tools/web#build, so apps/server/dist holds the
      # server bundle plus the web client.
      - name: Build server bundle
        run: vp run --filter t3 build

      - name: Build resource monitor
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked \
            --target x86_64-unknown-linux-gnu \
            --manifest-path native/resource-monitor/Cargo.toml
          target_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$target_dir"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$target_dir/"

      - name: Build CLI single-executable
        shell: bash
        env:
          # Keep in step with SEA_NODE_VERSION in apps/server/vite.config.ts.
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build CLI archive
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "${{ needs.version.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        shell: bash
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.version.outputs.version }}"

      - name: Write CLI archive checksums
        shell: bash
        working-directory: release-cli
        run: |
          set -euo pipefail
          sha256sum t3-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error
          retention-days: 1

  # Waits for the CLI archive so a release never carries an installer whose
  # SSH environments cannot start.
  build:
    name: Build and publish Windows x64
    needs: [version, cli_linux]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build desktop artifact
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ needs.version.outputs.version }}" \
            --output-dir release \
            --verbose

      - name: Download Linux CLI archive
        uses: actions/download-artifact@v8
        with:
          name: cli-linux-x64
          path: release-cli

      # electron-updater reads the newest prerelease whose tag carries the
      # "nightly" channel, then fetches nightly.yml and the installer from it.
      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: T3 Code (fork) ${{ needs.version.outputs.version }}
          body: Fork build of `${{ github.sha }}` from `${{ github.ref_name }}`.
          prerelease: true
          make_latest: false
          files: |
            release/*.exe
            release/nightly.yml
            release/*.blockmap
            release-cli/*.tar.gz
            release-cli/SHA256SUMS
          fail_on_unmatched_files: true

      # Each release carries a ~145 MB installer; the updater only needs the
      # newest one.
      - name: Prune old fork releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
