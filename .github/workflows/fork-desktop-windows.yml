name: Fork Desktop Windows

# Builds the fork's Windows installer on GitHub's free runners and publishes
# it as a prerelease. The installer keeps the official app id and nightly
# product name, so it installs over "T3 Code (Nightly)" and keeps the same
# user data. Its updater reads this fork's prereleases instead of upstream,
# so installed copies update to each build published here.

on:
  push:
    branches:
      - custom/usage-badge
  workflow_dispatch:

permissions:
  contents: write

# A half-published release would leave the updater a manifest without its
# installer, so a newer push waits instead of cancelling.
concurrency:
  group: fork-desktop-windows
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # Nightly-shaped versions keep the "(Nightly)" product name. The date and
      # a run number above upstream's build counter keep each fork build newer
      # than the official nightly it replaces.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base="$(node -p "const [a,b,c]=require('./apps/desktop/package.json').version.split('-')[0].split('.').map(Number); [a,b,c+1].join('.')")"
          version="${base}-nightly.$(date -u +%Y%m%d).$((9000 + GITHUB_RUN_NUMBER))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Build desktop artifact
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ steps.version.outputs.version }}" \
            --output-dir release \
            --verbose

      # electron-updater reads the newest prerelease whose tag carries the
      # "nightly" channel, then fetches nightly.yml and the installer from it.
      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: T3 Code (fork) ${{ steps.version.outputs.version }}
          body: Fork build of `${{ github.sha }}` from `${{ github.ref_name }}`.
          prerelease: true
          make_latest: false
          files: |
            release/*.exe
            release/nightly.yml
            release/*.blockmap
          fail_on_unmatched_files: true

      # Each release carries a ~145 MB installer; the updater only needs the
      # newest one.
      - name: Prune old fork releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
