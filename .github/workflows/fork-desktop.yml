name: Fork Desktop

# Builds the fork's Windows and macOS (Apple Silicon) apps on GitHub's free
# runners and publishes them together as one prerelease. The apps keep the
# official app id and nightly product name, so they install over
# "T3 Code (Nightly)" and keep the same user data. Their updater reads this
# fork's prereleases instead of upstream, so installed copies update to each
# build published here. The same release carries the Linux CLI archive that
# the app installs on SSH hosts.
#
# macOS builds are signed with a self-signed certificate rather than an Apple
# Developer ID, so they are not notarized: the first launch needs
# System Settings > Privacy & Security > Open Anyway. Updates still install,
# because Squirrel.Mac only requires every build to carry the same signature
# identity. Losing the certificate breaks updates for installed Macs.
#
# Secrets (repository settings):
# - MACOS_SELF_SIGN_P12: base64 of the self-signed code-signing .p12.
# - MACOS_SELF_SIGN_P12_PASSWORD: its password.

on:
  push:
    branches:
      - custom/usage-badge
  # Runs from another branch build without publishing.
  workflow_dispatch:

permissions:
  contents: write

# A half-published release would leave the updater a manifest without its
# installer, so a newer push waits instead of cancelling.
concurrency:
  group: fork-desktop
  cancel-in-progress: false

# T3 Connect (account sign-in and the relay). The values are public: the
# official build bakes the same ones into every installer. They are baked in
# at build time, and a build without them has no account feature. Set as
# repository variables on the fork.
env:
  T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
  T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
  T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
  T3CODE_RELAY_URL: ${{ vars.RELAY_URL }}
  T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}

jobs:
  # Nightly-shaped versions keep the "(Nightly)" product name. The date and
  # a run number above upstream's build counter keep each fork build newer
  # than the official nightly it replaces. Resolved once so the apps and the
  # CLI archive they download over SSH carry the same version.
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base="$(node -p "const [a,b,c]=require('./apps/desktop/package.json').version.split('-')[0].split('.').map(Number); [a,b,c+1].join('.')")"
          version="${base}-nightly.$(date -u +%Y%m%d).$((9000 + GITHUB_RUN_NUMBER))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

  # The desktop app starts SSH environments by downloading
  # t3-<version>-linux-x64.tar.gz and SHA256SUMS from the release with its own
  # version (see packages/shared/src/cliRelease.ts). Upstream has no release
  # for a fork version, so the fork has to attach the archive itself.
  cli_linux:
    name: Build Linux x64 CLI archive
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"

      # t3#build depends on @t3tools/web#build, so apps/server/dist holds the
      # server bundle plus the web client.
      - name: Build server bundle
        run: vp run --filter t3 build

      - name: Build resource monitor
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked \
            --target x86_64-unknown-linux-gnu \
            --manifest-path native/resource-monitor/Cargo.toml
          target_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$target_dir"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$target_dir/"

      # Setup Vite+ already installs the exact Node that package.json pins,
      # which is the one the single executable must embed.
      - name: Build CLI single-executable
        shell: bash
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build CLI archive
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "${{ needs.version.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        shell: bash
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.version.outputs.version }}"

      - name: Write CLI archive checksums
        shell: bash
        working-directory: release-cli
        run: |
          set -euo pipefail
          sha256sum t3-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error
          retention-days: 1

  build_windows:
    name: Build Windows x64
    needs: version
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build desktop artifact
        shell: bash
        run: |
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ needs.version.outputs.version }}" \
            --output-dir release \
            --verbose

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-win-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/nightly.yml
          if-no-files-found: error
          retention-days: 1

  build_mac:
    name: Build macOS arm64
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      # The signing step reads the certificate's fingerprint from
      # T3CODE_MACOS_SELF_SIGN_IDENTITY. The certificate stays untrusted, as it
      # is on every Mac that installs the app.
      - name: Import signing certificate
        shell: bash
        env:
          MACOS_SELF_SIGN_P12: ${{ secrets.MACOS_SELF_SIGN_P12 }}
          MACOS_SELF_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SELF_SIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_SELF_SIGN_P12" || -z "$MACOS_SELF_SIGN_P12_PASSWORD" ]]; then
            echo "::error::Add the MACOS_SELF_SIGN_P12 and MACOS_SELF_SIGN_P12_PASSWORD secrets (see the top of this workflow)."
            exit 1
          fi
          keychain="$RUNNER_TEMP/fork-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "::add-mask::$keychain_password"
          p12="$RUNNER_TEMP/fork-signing.p12"
          printf '%s' "$MACOS_SELF_SIGN_P12" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$MACOS_SELF_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          fingerprint="$(security find-certificate -a -Z "$keychain" | awk '/SHA-1 hash:/ { print $NF; exit }')"
          if [[ -z "$fingerprint" ]]; then
            echo "::error::No certificate found in MACOS_SELF_SIGN_P12."
            exit 1
          fi
          echo "Signing certificate SHA-1: $fingerprint"
          # Fail here rather than after a long build if codesign refuses the identity.
          probe="$RUNNER_TEMP/signing-probe"
          cp /usr/bin/true "$probe"
          codesign --force --sign "$fingerprint" --timestamp=none "$probe"
          codesign --verify --strict --verbose=2 "$probe"
          echo "T3CODE_MACOS_SELF_SIGN_IDENTITY=$fingerprint" >> "$GITHUB_ENV"

      - name: Build desktop artifact
        shell: bash
        run: |
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ needs.version.outputs.version }}" \
            --output-dir release \
            --verbose

      # Squirrel.Mac installs an update only if its signature satisfies the
      # installed app's designated requirement. Check the update zip the same
      # way before publishing.
      - name: Verify update signature
        shell: bash
        run: |
          set -euo pipefail
          zip="$(ls release/*-arm64.zip)"
          unpacked="$RUNNER_TEMP/verify-update"
          ditto -x -k "$zip" "$unpacked"
          app="$(find "$unpacked" -maxdepth 1 -name '*.app' | head -n 1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          requirement="$(codesign -d -r- "$app" 2>&1 | sed -n 's/^designated => //p')"
          echo "Designated requirement: $requirement"
          if ! grep -qiF "$T3CODE_MACOS_SELF_SIGN_IDENTITY" <<<"$requirement"; then
            echo "::error::The designated requirement does not pin the signing certificate, so updates would not install."
            exit 1
          fi
          # A leading "=" makes codesign read the requirement as text, not a file path.
          codesign --verify --deep --strict -R "=$requirement" "$app"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/nightly-mac.yml
          if-no-files-found: error
          retention-days: 1

  # Publishes only once every platform built, so an updater never finds a
  # release without its manifest, and never an app whose SSH environments
  # cannot start.
  publish:
    name: Publish prerelease
    needs: [version, cli_linux, build_windows, build_mac]
    if: github.ref == 'refs/heads/custom/usage-badge'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      # The app's update popup reads only the part above <details>, in order: the
      # `**vX** · stats` line becomes its GitHub link and the bullets its list
      # (apps/desktop/src/updates/releaseNotes.ts). Any other line there would
      # replace the list, so the build details stay in the fold.
      - name: Check out history for release notes
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: src

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          FORK_EMAIL: mohanaprasath6623@gmail.com
        run: |
          set -euo pipefail
          cd src
          # The newest earlier release this build grows from bounds the commit list.
          prev=""
          for tag in $(gh release list --limit 20 --json tagName --jq '.[].tagName'); do
            if [ "$tag" != "v$VERSION" ] && git rev-parse -q --verify "$tag^{commit}" >/dev/null &&
              git merge-base --is-ancestor "$tag" "$GITHUB_SHA"; then
              prev="$tag"
              break
            fi
          done
          if [ -n "$prev" ]; then range="$prev..$GITHUB_SHA"; else range="$GITHUB_SHA~20..$GITHUB_SHA"; fi
          git log --no-merges --format='%ae%x09%s' "$range" > "$RUNNER_TEMP/commits.tsv"
          # The popup lists the fork's commits, then up to 10 upstream ones without
          # CI, dependency or test noise. Backticks keep `@name` from mentioning anyone.
          awk -F'\t' -v email="$FORK_EMAIL" -v version="$VERSION" -v sha="${GITHUB_SHA:0:10}" \
            -v since="${prev:-the last 20 commits}" '
            function plural(n, word) { return n " " word (n == 1 ? "" : "s") }
            NF < 2 { next }
            {
              subject = substr($0, length($1) + 2)
              gsub(/@[A-Za-z0-9_\/.-]+/, "`&`", subject)
              if ($1 == email) { fork[++nf] = subject; next }
              upstream[++nu] = subject
              if (nn >= 10 || subject ~ /^((ci|chore|build|tests?|docs|refactor|style)(\([^)]*\))?|[a-z]+\((ci|deps|release|tests?)\))!?: /) next
              sub(/^[a-z]+(\([^)]*\))?!?: /, "", subject)
              notable[++nn] = toupper(substr(subject, 1, 1)) substr(subject, 2)
            }
            END {
              if (nf && nu) stats = plural(nf, "fork change") ", " nu " from upstream"
              else if (nf) stats = plural(nf, "fork change")
              else if (nu) stats = plural(nu, "upstream change")
              else stats = "no new commits"
              printf "**v%s** · %s\n\n", version, stats
              for (i = 1; i <= nf && i <= 15; i++) print "- " fork[i]
              for (i = 1; i <= nn; i++) print "- " notable[i]
              if (!nf && !nu) print "- Rebuild with no new commits."
              printf "\n<details>\n<summary>Full changelog</summary>\n\nFork build of `%s` (since %s).\n", sha, since
              if (nf) { printf "\n**Fork (%d):**\n\n", nf; for (i = 1; i <= nf; i++) print "- " fork[i] }
              if (nu) {
                printf "\n**From upstream (%d):**\n\n", nu
                for (i = 1; i <= nu && i <= 300; i++) print "- " upstream[i]
                if (nu > 300) printf "- ...and %d more\n", nu - 300
              }
              printf "\n</details>\n"
            }' "$RUNNER_TEMP/commits.tsv" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      # electron-updater reads the newest prerelease whose tag carries the
      # "nightly" channel, then fetches nightly.yml (Windows) or
      # nightly-mac.yml (macOS) and the app from it.
      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: T3 Code (fork) ${{ needs.version.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: true
          make_latest: false
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/nightly.yml
            release/nightly-mac.yml
            release/*.tar.gz
            release/SHA256SUMS
          fail_on_unmatched_files: true

      # Each release carries a few hundred MB of apps; the updater only needs
      # the newest one.
      - name: Prune old fork releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
