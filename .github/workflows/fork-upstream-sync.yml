name: Fork Upstream Sync

# Once a day, merges the newest official nightly into the fork branch.
# - A clean merge that typechecks is pushed straight to the branch, which
#   triggers "Fork Desktop Windows" to build and publish the update.
# - A conflicting merge is resolved by Claude Code, typechecked, and opened as
#   a pull request. Merging that PR publishes the update.
#
# Secrets (repository settings):
# - FORK_SYNC_TOKEN: fine-grained token for this repository only, with
#   Contents, Workflows, and Pull requests set to read and write. The default
#   GITHUB_TOKEN cannot push upstream's workflow edits, and its pushes do not
#   trigger the build.
# - CLAUDE_CODE_OAUTH_TOKEN: from `claude setup-token`. Only used on conflicts.

on:
  schedule:
    # 21:47 UTC is 03:17 IST, so the update is ready in the morning.
    - cron: "47 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

env:
  FORK_BRANCH: custom/usage-badge
  UPSTREAM_URL: https://github.com/pingdotgg/t3code.git

jobs:
  sync:
    name: Merge the newest upstream nightly
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require the sync token
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [[ -z "$FORK_SYNC_TOKEN" ]]; then
            echo "::error::Add the FORK_SYNC_TOKEN repository secret (see the comment at the top of this workflow)."
            exit 1
          fi

      # Upstream's workflows target its own runners and secrets. On the fork
      # they would fail or, worse, publish, so only the fork's own run. This
      # also catches workflows that a merge adds later.
      - name: Disable upstream workflows on the fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --repo "$GITHUB_REPOSITORY" --all --json path,state --jq '.[] | select(.state == "active") | .path' |
            while read -r path; do
              case "$(basename "$path")" in
                fork-*.yml) ;;
                *) echo "Disabling $path"; gh workflow disable "$(basename "$path")" --repo "$GITHUB_REPOSITORY" ;;
              esac
            done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Find the newest upstream nightly
        id: upstream
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL"
          tag="$(git ls-remote --tags --refs upstream 'v*-nightly.*' | awk '{print $2}' | sed 's#refs/tags/##' | sort -V | tail -1)"
          git fetch --no-tags upstream "refs/tags/$tag:refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "Already contains $tag."
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge
        id: merge
        if: steps.upstream.outputs.merged == 'false'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git merge --no-ff --no-edit -m "Merge upstream $TAG into $FORK_BRANCH" "$TAG"; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U | tee conflicted-files.txt
          fi

      - name: Setup Vite+
        if: steps.upstream.outputs.merged == 'false'
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      # Conflict markers can break the lockfile, so a failed install is
      # left for Claude to fix with the rest of the merge.
      - name: Install dependencies
        if: steps.upstream.outputs.merged == 'false'
        run: |
          vp install && vp run --filter @t3tools/desktop ensure:electron || [[ "${{ steps.merge.outputs.conflicts }}" == "true" ]]

      - name: Resolve conflicts with Claude Code
        if: steps.merge.outputs.conflicts == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "::error::The merge has conflicts. Add the CLAUDE_CODE_OAUTH_TOKEN secret, or merge $TAG by hand."
            exit 1
          fi
          npm install --global @anthropic-ai/claude-code
          base="$(git merge-base HEAD "$TAG")"
          cat > /tmp/prompt.md <<EOF
          You are finishing a git merge of the upstream T3 Code nightly $TAG into
          this personal fork's branch $FORK_BRANCH. The merge is in progress and
          these files have conflicts:

          $(cat conflicted-files.txt)

          The fork's own commits (its features) are:

          $(git log --oneline --no-merges "$base"..HEAD)

          Rules:
          - Keep every fork feature working and keep every upstream change.
            When both sides changed the same code, combine them.
          - Remove all conflict markers and stage the resolved files with git add.
          - If the lockfile conflicted, take upstream's version and run vp install.
          - Then run \`vp run --filter @t3tools/desktop ensure:electron\` and
            \`vpr typecheck\`, and fix what the merge broke.
          - Run the unit tests of the files you changed with \`vp test run <file>\`
            from the package folder.
          - Do not commit, push, or edit files the merge did not touch unless a
            type error needs it.
          - End with a short summary of each conflict and how you resolved it.
          EOF
          claude -p "$(cat /tmp/prompt.md)" --model opus --dangerously-skip-permissions \
            --output-format text | tee claude-summary.md

      - name: Check the result
        if: steps.upstream.outputs.merged == 'false'
        run: |
          set -euo pipefail
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]] || git grep -n -I -E '^(<<<<<<<|>>>>>>>) ' -- . ':!*.md' >/dev/null; then
            echo "::error::Conflict markers remain."
            exit 1
          fi
          vpr typecheck

      - name: Push the clean merge
        if: steps.merge.outputs.conflicts == 'false'
        run: git push origin "HEAD:$FORK_BRANCH"

      - name: Open a pull request for the resolved merge
        if: steps.merge.outputs.conflicts == 'true'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          git add -A
          git reset -q -- claude-summary.md conflicted-files.txt
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit -m "Merge upstream $TAG into $FORK_BRANCH"
          fi
          branch="sync/$TAG"
          git push --force origin "HEAD:refs/heads/$branch"
          {
            echo "Claude Code resolved the conflicts in this merge of upstream \`$TAG\`. Typecheck passed."
            echo
            echo "Merging this PR builds and publishes the update."
            echo
            echo "## Claude's summary"
            echo
            cat claude-summary.md
          } > pr-body.md
          if gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$branch" --repo "$GITHUB_REPOSITORY" --body-file pr-body.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$FORK_BRANCH" --head "$branch" \
              --title "Merge upstream $TAG" --body-file pr-body.md
          fi
